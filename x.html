<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Ticket on X | Launch Week 16</title>
    <!--
      A ticket as it reads when someone posts its link on X: a post with the
      summary_large_image card at feed width, the domain over its corner as X
      draws it. The cards are the real ones, /api/og/<username>, one post per
      layout, on a light or black card, in X's light or dark mode; then the
      3D shots, rendered by the real scene and captured as stills.
      ?u=<username>&card=light|dark&ui=light|dark&text=<the post>
    -->
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { font: 15px/20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; transition: background 0.2s; }
      .light { --bg: #fff; --fg: #0f1419; --muted: #536471; --line: #eff3f4; --field: #eff3f4; }
      .dark { --bg: #000; --fg: #e7e9ea; --muted: #71767b; --line: #2f3336; --field: #202327; }
      body { background: var(--bg); color: var(--fg); }
      [hidden] { display: none !important; }
      .bar { position: sticky; top: 0; z-index: 1; background: var(--bg); width: 600px; max-width: 100%; box-sizing: border-box; display: flex; gap: 8px; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); }
      .bar input { flex: 1; min-width: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid transparent; background: var(--field); color: var(--fg); font: inherit; outline: none; }
      .bar input:focus { border-color: #1d9bf0; }
      .bar button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--fg); font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; cursor: pointer; white-space: nowrap; }
      .page { width: 600px; max-width: 100%; border-left: 1px solid var(--line); border-right: 1px solid var(--line); box-sizing: border-box; }
      .layout { padding: 10px 16px 0; color: var(--muted); font: 12px/16px ui-monospace, 'Geist Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
      .post { display: flex; gap: 8px; padding: 8px 16px 12px; border-bottom: 1px solid var(--line); }
      .avatar { width: 40px; height: 40px; border-radius: 50%; background: #a8b3ba; flex: none; }
      .body { flex: 1; min-width: 0; }
      .head { display: flex; gap: 4px; white-space: nowrap; overflow: hidden; }
      .name { font-weight: 700; }
      .muted { color: var(--muted); }
      .text { margin: 2px 0 12px; white-space: pre-line; overflow-wrap: anywhere; }
      .text a { color: #1d9bf0; text-decoration: none; }
      .card { position: relative; display: block; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--field); aspect-ratio: 1200 / 630; }
      .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
      /* a live 3D shot: the app at the card's own 1200x630, scaled down to the post */
      .section { padding: 20px 16px 4px; font-weight: 800; font-size: 20px; line-height: 24px; border-bottom: 1px solid var(--line); }
      .domain { position: absolute; left: 12px; bottom: 12px; padding: 0 4px; border-radius: 4px; background: rgba(0, 0, 0, 0.77); color: #fff; font-size: 13px; line-height: 20px; }
      .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
      .actions { display: flex; justify-content: space-between; max-width: 425px; margin-top: 12px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body class="light">
    <form class="bar" id="form">
      <input id="u" placeholder="username" aria-label="Ticket username" autocomplete="off" spellcheck="false" />
      <button type="button" id="random" title="Someone else's ticket">Random</button>
      <button type="button" id="card">Black card</button>
      <button type="button" id="ui">Dark X</button>
    </form>
    <div class="page" id="page"></div>
    <template id="post">
      <div class="layout"></div>
      <div class="post">
        <div class="avatar" aria-hidden="true"></div>
        <div class="body">
          <div class="head"><span class="name"></span><span class="muted handle"></span></div>
          <div class="text"></div>
          <a class="card" target="_blank" rel="noopener">
            <img alt="" />
            <span class="empty"></span>
            <span class="domain">supabase.com</span>
          </a>
          <div class="actions"><span>💬 3</span><span>🔁 12</span><span>♡ 48</span><span>📊 2.1K</span></div>
        </div>
      </div>
    </template>
    <script type="module">
      /**
       * 3D shots: the real scene (?shot=<username>) rendering the ticket on
       * the metal card, no text, captured as a still PNG as X would get it.
       * Close and low, with raking light so the etched grooves read, deep
       * etching and bloom.
       */
      const LOOK = 'theme=Dark&card.etchDepth=0.5&render.bloom=0.55&render.noise=0';
      const SHOTS = [
        ['Green · The artwork, corner', 'lighting=Field Green&render.lightAngle=-40&cam=-1,-1,0.6&target=-1.1,-1.1,-0.35'],
        ['Green · The name, edge-on', 'lighting=Field Green&render.lightAngle=100&cam=1.6,-0.5,0&target=1,-0.4,-0.35'],
        ['Green · The artwork, head-on and close', 'lighting=Field Green&render.lightAngle=20&cam=0.15,0.1,0.9&target=0.1,0.05,-0.35'],
        ['Green · Grazing across the grooves', 'lighting=Field Green&render.lightAngle=160&cam=0.2,-1.5,0.05&target=0.1,0.3,-0.35'],
        ['Green · The name, from below', 'lighting=Field Green&render.lightAngle=60&cam=1.4,-1.6,0.4&target=1.05,0,-0.35'],
        ['Green neon · The artwork, corner', 'lighting=Green Neon&render.lightAngle=-40&cam=-1,-1,0.6&target=-1.1,-1.1,-0.35'],
        ['Supabase · The artwork, corner', 'lighting=Field Supabase&render.lightAngle=-40&cam=-1,-1,0.6&target=-1.1,-1.1,-0.35'],
        ['Green · Top edge, the marks', 'lighting=Field Green&render.lightAngle=-120&cam=-0.9,1.9,0.5&target=-1,1.2,-0.35'],      ];
      // the share card's layouts (CARD_LAYOUTS in api/_lib/card.ts)
      const LAYOUTS = [
        ['centre', 'Centre: LW and 16 either side'],
        ['left', 'Left: LW16, ticket on the right'],
        ['stacked', 'Stacked: LW over 16, ticket on the right'],
        ['bleed', 'Bleed: ticket large, off the edge'],
        ['landscape', 'Landscape: a loyalty card, centred'],
        ['landscape-left', 'Landscape: LW16, the card on the right'],
      ];
      const q = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      const base = import.meta.env.BASE_URL;
      const state = { u: '', card: q.get('card') === 'dark' ? 'dark' : 'light', ui: q.get('ui') === 'dark' ? 'dark' : 'light' };
      const remember = () => {
        const next = new URLSearchParams(location.search);
        for (const k of ['u', 'card', 'ui']) state[k] && state[k] !== 'light' ? next.set(k, state[k]) : next.delete(k);
        history.replaceState(null, '', `?${next}`);
      };

      const posts = LAYOUTS.map(([layout, title]) => {
        const node = $('post').content.cloneNode(true);
        node.querySelector('.layout').textContent = title;
        const els = {
          name: node.querySelector('.name'),
          handle: node.querySelector('.handle'),
          text: node.querySelector('.text'),
          card: node.querySelector('.card'),
          img: node.querySelector('img'),
          empty: node.querySelector('.empty'),
        };
        els.img.addEventListener('load', () => {
          els.img.hidden = false;
          els.empty.hidden = true;
        });
        els.img.addEventListener('error', () => {
          els.img.hidden = true;
          els.empty.hidden = false;
          els.empty.textContent = 'No ticket with that username';
        });
        $('page').append(node);
        return { layout, els };
      });

      $('page').append(Object.assign(document.createElement('div'), { className: 'section', textContent: '3D shots' }));
      const shots = SHOTS.map(([title, query]) => {
        const node = $('post').content.cloneNode(true);
        node.querySelector('.layout').textContent = title;
        const els = {
          name: node.querySelector('.name'),
          handle: node.querySelector('.handle'),
          text: node.querySelector('.text'),
          card: node.querySelector('.card'),
          img: node.querySelector('img'),
          empty: node.querySelector('.empty'),
        };
        $('page').append(node);
        return { query, els };
      });

      // one scene at the share image's own size, out of sight: each shot in turn is rendered there and captured
      const stage = Object.assign(document.createElement('iframe'), { title: 'shot renderer' });
      Object.assign(stage.style, { position: 'fixed', left: '0', top: '0', width: '1200px', height: '630px', border: '0', opacity: '0', pointerEvents: 'none', zIndex: '-1' });
      document.body.append(stage);
      let shooting = 0;
      let captures = 0;
      const shoot = async (u) => {
        const job = ++shooting;
        for (const { query, els } of shots) {
          if (job !== shooting) return;
          els.empty.hidden = false;
          els.empty.textContent = 'Rendering…';
          // each capture has its own id: a late reply from an earlier shot (or person) can't land here
          const id = ++captures;
          const png = await new Promise((done) => {
            const onMessage = (e) => {
              if (e.source !== stage.contentWindow) return;
              if (e.data?.shot === 'ready' && job === shooting) stage.contentWindow.postMessage({ shot: 'capture', id }, location.origin);
              if (e.data?.shot === 'png' && e.data.id === id) {
                removeEventListener('message', onMessage);
                done(e.data.png);
              }
            };
            addEventListener('message', onMessage);
            stage.src = `${base}?shot=${u}&cards=One&${LOOK}&${query}&n=${id}`;
          });
          if (job !== shooting) return;
          els.img.src = png;
          els.img.hidden = false;
          els.empty.hidden = true;
        }
        stage.src = 'about:blank';
      };

      let lastShot = '';
      const render = () => {
        const u = state.u;
        const link = `${location.origin}${base}t/${u}`;
        document.body.className = state.ui;
        $('card').textContent = state.card === 'dark' ? 'Light card' : 'Black card';
        $('ui').textContent = state.ui === 'dark' ? 'Light X' : 'Dark X';
        for (const { layout, els } of posts) {
          els.name.textContent = u || 'Ticket holder';
          els.handle.textContent = u ? `@${u} · 2m` : '· 2m';
          els.text.replaceChildren(q.get('text') ?? 'Got my Launch Week 16 ticket\n', Object.assign(document.createElement('a'), { href: link, textContent: link.replace(/^https?:\/\//, '') }));
          els.card.href = link;
          const src = u ? `${base}api/og/${u}?layout=${layout}&theme=${state.card}` : '';
          // a new card: nothing of the last one stays up while it's drawn
          if (els.img.dataset.src !== src) {
            els.img.dataset.src = src;
            els.img.hidden = true;
            els.empty.hidden = false;
            els.empty.textContent = u ? 'Rendering…' : 'Type a username to see their ticket';
            if (u) els.img.src = src;
            else els.img.removeAttribute('src');
          }
        }
        for (const { els } of shots) {
          els.name.textContent = u || 'Ticket holder';
          els.handle.textContent = u ? `@${u} · 2m` : '· 2m';
          els.text.replaceChildren(q.get('text') ?? 'Got my Launch Week 16 ticket\n', Object.assign(document.createElement('a'), { href: link, textContent: link.replace(/^https?:\/\//, '') }));
          els.card.href = link;
          if (u !== lastShot) {
            els.img.hidden = true;
            els.empty.hidden = false;
            els.empty.textContent = 'Type a username to see their ticket';
          }
        }
        if (u !== lastShot) {
          lastShot = u;
          if (u) shoot(u);
          else shooting++;
        }
        remember();
      };

      // the cards are drawn on request: wait for a pause in typing
      let typing = 0;
      $('u').value = q.get('u') ?? '';
      state.u = $('u').value;
      $('u').addEventListener('input', (e) => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          state.u = e.target.value.toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '').slice(0, 24);
          render();
        }, 350);
      });
      $('form').addEventListener('submit', (e) => e.preventDefault());
      // another person's ticket, at random: the usernames are public to read
      let everyone = null;
      $('random').addEventListener('click', async () => {
        const url = import.meta.env.VITE_SUPABASE_URL;
        const key = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY;
        everyone ??= fetch(`${url}/rest/v1/tickets?select=username&limit=1000`, { headers: { apikey: key, authorization: `Bearer ${key}` } })
          .then((r) => r.json())
          .then((rows) => rows.map((r) => r.username));
        const names = (await everyone).filter((n) => n !== state.u);
        if (!names.length) return;
        state.u = $('u').value = names[Math.floor(Math.random() * names.length)];
        render();
      });
      $('card').addEventListener('click', () => {
        state.card = state.card === 'dark' ? 'light' : 'dark';
        render();
      });
      $('ui').addEventListener('click', () => {
        state.ui = state.ui === 'dark' ? 'light' : 'dark';
        render();
      });
      render();
    </script>
  </body>
</html>
