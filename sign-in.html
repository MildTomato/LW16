<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sign in | Supabase</title>
    <!--
      Previews and localhost only: a stand-in for supabase.com/dashboard/sign-in,
      laid out like it. Signs in for real, to this site's own Supabase project,
      then goes back to returnTo. On supabase.com the real dashboard sign-in is used.
    -->
    <style>
      @font-face { font-family: 'Geist'; src: url('/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'Geist'; src: url('/fonts/Geist-Medium.woff2') format('woff2'); font-weight: 500 600; font-display: swap; }
      :root { --bg: #121212; --panel: #171717; --ink: #ededed; --mid: #a0a0a0; --soft: #707070; --line: #2e2e2e; --field: #1f1f1f; --brand: #3ecf8e; --brand-ink: #0f2a1d; --danger: #f87171; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
      body { font: 400 14px/1.5 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
      a { color: inherit; }
      header { padding: 24px 32px; display: flex; align-items: center; gap: 10px; }
      header svg { width: 109px; height: 21px; }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { width: 100%; max-width: 384px; }
      h1 { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 4px; }
      .sub { color: var(--mid); margin: 0 0 32px; }
      form { display: grid; gap: 16px; }
      label { display: grid; gap: 8px; color: var(--mid); }
      input { width: 100%; height: 38px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; outline: none; }
      input:focus { border-color: var(--soft); box-shadow: 0 0 0 2px rgba(62, 207, 142, 0.18); }
      button { height: 38px; border-radius: 6px; border: 1px solid #36b37e; background: var(--brand); color: var(--brand-ink); font: 500 14px 'Geist', system-ui, sans-serif; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      .switch { text-align: center; color: var(--mid); margin-top: 24px; }
      .switch button { all: unset; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
      .msg { min-height: 20px; font-size: 13px; color: var(--danger); }
      .msg.ok { color: var(--brand); }
      .note { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--soft); font-size: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <!-- the Supabase wordmark's mark, standing in for the full logo -->
      <svg viewBox="0 0 109 113" fill="none" aria-label="Supabase" style="width: 22px; height: 22px">
        <path d="M63.7 110.3c-2.9 3.6-8.7 1.6-8.8-3L54.1 40h45.4c8.2 0 12.8 9.5 7.7 15.9L63.7 110.3Z" fill="#249361" />
        <path d="M45.3 2.1c2.9-3.6 8.7-1.6 8.8 3l.4 67.3H9.8c-8.2 0-12.8-9.5-7.7-15.9L45.3 2.1Z" fill="#3ECF8E" />
      </svg>
      <span style="font-weight: 600; font-size: 18px; letter-spacing: -0.01em">supabase</span>
    </header>
    <main>
      <div class="card">
        <h1 id="title">Welcome back</h1>
        <p class="sub" id="sub">Sign in to your account</p>
        <form id="form" novalidate>
          <label>Email <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required /></label>
          <label>Password <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" /></label>
          <div class="msg" id="msg" role="status" aria-live="polite"></div>
          <button id="submit" type="submit">Sign In</button>
        </form>
        <p class="switch" id="switch">Don't have an account? <button type="button" id="mode">Sign Up Now</button></p>
        <p class="note">Preview sign-in. On supabase.com this is your Supabase account.</p>
      </div>
    </main>
    <script type="module" src="/src/signIn.ts"></script>
  </body>
</html>
