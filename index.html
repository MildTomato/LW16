    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050508;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #canvas-host {
        position: fixed;
        inset: 0;
      }
      #canvas-host canvas {
        display: block;
        touch-action: none;
      }
      /* a rounded button: filled a shade off the page with an ink outline, filled with ink on hover, pressed in when held */
      .pill {
        color: var(--ink);
        background: var(--paper);
        transition: background-color 0.15s ease, color 0.15s ease, scale 0.1s ease;
      }
      .pill:hover {
        background: var(--ink);
        color: var(--paper);
      }
      .pill:active:not(:disabled) {
        scale: 0.95;
      }
      /* the main action: filled with ink, lifting to the page's fill on hover */
      .pill.primary {
        background: var(--ink);
        color: var(--paper);
      }
      .pill.primary:hover {
        background: var(--paper);
        color: var(--ink);
      }
      .pill:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .pill:disabled:hover {
        background: var(--paper);
        color: var(--ink);
      }
      .pill.primary:disabled:hover {
        background: var(--ink);
        color: var(--paper);
      }
      .pill:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      /* the ticket console's type: Geist Pixel for what you make, Geist Mono for the machine */
      @font-face {
        font-family: 'Geist Pixel Square';
        src: url('/fonts/GeistPixel-Square.woff2') format('woff2');
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('/fonts/GeistMono-Regular.woff2') format('woff2');
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
